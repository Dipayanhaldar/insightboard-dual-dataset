<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="InsightBoard VDB (Visual Dashboard) — Enterprise Shopping Mall, Retail Sales & Schema-Aware Business Intelligence Platform with AI Optimization, What-If Simulation, Dataset Comparison, and Multi-Format Export." />
    <meta property="og:title" content="InsightBoard VDB" />
    <meta property="og:description" content="InsightBoard VDB (Visual Dashboard) — Enterprise Shopping Mall, Retail Sales & Schema-Aware Business Intelligence Platform with AI Optimization, What-If Simulation, Dataset Comparison, and Multi-Format Export." />
    <meta name="application-name" content="InsightBoard VDB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InsightBoard VDB" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/insightboard.svg" />
    <link rel="apple-touch-icon" href="/icons/insightboard-192.png" />
    <title>InsightBoard VDB</title>
    <style>
      .project-dossier-link {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 28px);
        box-sizing: border-box;
        padding: 10px 14px;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 999px;
        background: #1e4b86;
        color: #fff;
        text-decoration: none;
        font: 700 12.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-shadow: 0 6px 18px rgba(12, 34, 65, .22);
        transition: background .15s ease, box-shadow .15s ease;
      }
      .project-dossier-link:hover {
        background: #173d70;
        box-shadow: 0 8px 22px rgba(12, 34, 65, .28);
      }
      @media print {
        .project-dossier-link { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a
      class="project-dossier-link"
      href="https://app.notion.com/p/405a0f05cdd281a4a971fd32474e0fbd"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the InsightBoard project dossier in Notion"
    >Project Dossier</a>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(error => {
            console.error("InsightBoard VDB service worker registration failed:", error);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
