services:
  - type: web
    name: insightboard-vdb
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev --no-audit --no-fund --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DATABASE
        value: insightboard_v2
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: MAX_REPORTS_PER_USER
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

