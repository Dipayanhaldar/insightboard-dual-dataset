services:
  - type: web
    name: insightboard-v2
    runtime: node
    plan: free
    region: singapore
    branch: feature/insightboard-v2.0.1.1
    autoDeployTrigger: off
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DATABASE
        value: insightboard_v2
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: MAX_REPORTS_PER_USER
        value: "20"
