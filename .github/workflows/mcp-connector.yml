name: MCP connector validation

on:
  push:
    branches:
      - feature/mcp-connector-v3
    paths:
      - "server/**"
      - "src/v2/**"
      - "src/shopping_mall_sales.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mcp-connector.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "server/**"
      - "src/v2/**"
      - "src/shopping_mall_sales.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mcp-connector.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh Bun lockfile
        run: bun install
      - name: Commit the resolved Bun lockfile when dependencies change
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): sync Bun lockfile for MCP connector"
            git push
          fi
      - name: Check server syntax
        run: npm run check:server
      - name: Run server and MCP tests
        run: npm test
      - name: Build web application
        run: npm run build
