name: Secret & Zero-Billing Quota Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-and-quota-scan:
    name: Scan All Branches for Secrets & Verify Zero-Billing Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for accidental API keys, passwords, or connection URIs
        run: |
          set -e
          echo "Scanning repository for leaked secrets or private credentials..."
          # Firebase browser API keys are public client identifiers, not server secrets.
          # .env.example and markdown docs contain intentional placeholders, not live connection credentials.
          if git grep -nE "(sk-[0-9A-Za-z]{32,}|xai-[0-9A-Za-z]{24,}|gsk_[0-9A-Za-z]{24,}|mongodb\+srv://[^<\s]+:[^@\s]+@)" -- \
            ':!package-lock.json' \
            ':!bun.lock' \
            ':(exclude,glob)**/.env.example' \
            ':(exclude,glob)**/*.md' \
            ':(exclude,glob)**/*.zip' \
            ':!firebase-applet-config.json' \
            ':!.github/workflows/secret-and-quota-guard.yml'; then
            echo "ERROR: Potential secret or credential detected in tracked files!"
            exit 1
          fi
          echo "Zero leaked credentials found."

      - name: Verify Zero-Billing Quota Guardrail in Server
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const src = fs.readFileSync('server/index.js', 'utf8');
            if (!src.includes('fail-closed-on-quota-exhaustion')) {
              throw new Error('Zero-billing quota guardrail missing from server/index.js');
            }
            console.log('Zero-billing quota guardrail verified.');
          "
