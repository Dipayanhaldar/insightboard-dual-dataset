name: InsightBoard CI

on:
  push:
    branches:
      - main
      - develop
      - feature/global-ai-platform-foundation
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: insightboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11 for Scientific Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --legacy-peer-deps

      - name: Validate PWA package prerequisites
        run: |
          node --check public/sw.js
          node scripts/validate-pwa.mjs

      - name: Check Node & Python backend syntax
        run: |
          npm run check:server
          npm run check:python

      - name: Run API & Python Scientific Engine tests
        run: npm test

      - name: Build frontend for Render & Cloud Hosts
        run: npm run build

      - name: Verify offline production asset cache
        run: npm run check:pwa:build
