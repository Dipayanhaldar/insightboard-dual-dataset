name: Stage 2 AI provider validation

on:
  push:
    branches:
      - feature/ai-provider-hub-site-gnani-limit
  pull_request:
    branches:
      - feature/insightboard-v2.0.1.1
    paths:
      - "server/**"
      - "src/v2/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/stage2-ai-provider-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Express server syntax
        run: npm run check:server
      - name: Build Vite frontend
        run: npm run build
