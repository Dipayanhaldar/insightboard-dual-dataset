name: InsightBoard V2 branch build check
on:
  push:
    branches:
      - feature/insightboard-v2.0.1.1
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
