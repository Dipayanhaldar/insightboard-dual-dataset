name: InsightBoard V2 branch build check
on:
  push:
    branches:
      - feature/insightboard-v2.0.1.1
      - feature/gnani-voice-studio
      - feature/global-ai-platform-foundation
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --include=dev --no-audit --no-fund --legacy-peer-deps
      - run: npm run check:server
      - run: npm run check:python
      - run: npm test
      - run: npm run build
