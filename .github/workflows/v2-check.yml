name: InsightBoard V2 branch build check
on:
  push:
    branches:
      - feature/insightboard-v2.0.1.1
      - feature/gnani-voice-studio
      - feature/global-ai-platform-foundation
      - feature/college-project-blackcoffer
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev
      - run: npm run check:server
      - run: npm test
      - run: npm run build
